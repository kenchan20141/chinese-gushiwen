<!DOCTYPE html>
<html lang="zh-TW">
<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文言特訓</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <!-- 引入 OpenCC 繁簡轉換套件 -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <style>
        :root {
            --paper-bg: #f4ecd8;         /* 宣紙米黃 */
            --ink-black: #2b2b2b;        /* 濃墨黑 */
            --ink-gray: #5c5c5c;         /* 淡墨灰 */
            --cinnabar-red: #a73322;     /* 朱砂紅 */
            --border-line: #4a4a4a;      /* 烏絲欄框線 */
            --morandi-green: #7a8b79;    /* 莫蘭迪綠 */
            --panel-bg: #faf4e3;         /* 抽屜底色 */
            --font-book: "STFangsong", "FangSong", "Kaiti TC", "BiauKai", "TW-Kai", "Noto Serif TC", serif;
            
            /* 預設懸浮面板尺寸，將會被 LocalStorage 覆蓋 */
            --panel-width: 450px;
            --panel-height: 40vh;
        }

        body {
            margin: 0; padding: 0;
            font-family: var(--font-book);
            background-color: var(--paper-bg);
            color: var(--ink-black);
            background-image: 
                linear-gradient(90deg, rgba(43,43,43,0.02) 1px, transparent 1px),
                linear-gradient(rgba(43,43,43,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

     .book-container {
            max-width: 900px; margin: 30px auto; 
            background: #faf4e3;
            border: 1px solid var(--border-line);
            outline: 3px solid var(--border-line);
            outline-offset: -8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            min-height: 90vh; position: relative;
            animation: unfoldScroll 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            /* 🛑 這裡只允許 transform, opacity, box-shadow 有動畫 */
              transition: transform 0.3s ease, opacity 0.3s ease, box-shadow 0.3s ease;
        }

        @keyframes unfoldScroll {
            0% { transform: scaleX(0.01); opacity: 0; }
            50% { transform: scaleX(1); opacity: 1; }
            100% { transform: scaleX(1); opacity: 1; }
        }

        .book-page { padding: 40px 50px; animation: inkFadeIn 1.2s ease 0.4s both; }

        @keyframes inkFadeIn {
            0% { opacity: 0; filter: blur(4px); transform: translateY(10px); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        .view { display: none; }
        .view.active { display: block; animation: inkFadeIn 0.5s ease both; }

       /* ✨ 顛覆性設計：殿堂級牌匾 (Plaque) 與懸掛印籤 */
        header {
            position: relative;
            margin: -40px -50px 35px -50px; /* 向外延展，貼齊書本邊緣 */
            padding: 45px 0;
            background-color: #15181c; /* 極致深邃的玄黑底色 */
            /* 隱約的橫向絹絲紋理 */
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px);
            border-bottom: 6px solid var(--cinnabar-red); /* 底部厚重朱砂壓線 */
            text-align: center;
            border-radius: 4px 4px 0 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            overflow: hidden; /* 確保內框不會超出 */
        }
        
        /* 牌匾內層的暗金裝飾線 */
        header::after {
            content: ""; position: absolute;
            top: 10px; bottom: 10px; left: 10px; right: 10px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            pointer-events: none;
        }

        .header-actions {
            position: absolute; 
            right: 35px; 
            top: 50%; 
            transform: translateY(-50%); /* 完美垂直置中 */
            display: flex; gap: 15px; align-items: center;
            z-index: 5;
        }

        .header-btn {
            background: transparent; border: none; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            padding: 5px; display: flex; border-radius: 50%;
        }
        
        /* 將右側的按鈕顏色配合黑底改為暗金色與朱紅色 */
      /* 修改生詞庫(左側圖示)為古典的翠玉綠，與鎦金字體區隔 */
       .header-btn:nth-child(1) svg { stroke: #4ea5b8; }
        .header-btn:nth-child(2) svg { stroke: var(--cinnabar-red); }
        
        .header-btn:hover { 
            transform: scale(1.15) translateY(-2px); 
            background: rgba(255,255,255,0.08);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

  h1.app-title {
    position: relative;
    color: #d4af37; 
    font-size: 3.4em; 
    letter-spacing: 24px; 
    margin: 0 0 0 24px;
    padding-left: 0;
    font-weight: bold; /* ✨ 已加粗 */
    font-family: var(--font-book); 
    text-shadow: 0 4px 20px rgba(0,0,0,0.9); 
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
}
        /* 破格設計：將「神思」轉為垂直懸掛的壓角籤條 */
        .stamp {
            display: inline-flex;
            writing-mode: vertical-rl; /* 豎排文字 */
            background: var(--cinnabar-red);
            color: #fff;
            font-size: 0.35em;
            letter-spacing: 8px;
            padding: 16px 8px 8px 8px; 
            margin-left: 5px;
            border: 2px solid #f4ecd8; /* 雙層畫框感 */
            outline: 1px solid var(--cinnabar-red); 
            outline-offset: 2px;
            transform: translateY(22px); /* 故意向下懸掛，突破標題的水平線 */
            box-shadow: 3px 6px 15px rgba(0,0,0,0.6);
            font-weight: bold;
            font-family: var(--font-book);
        }
        .loading-container { text-align: center; margin-top: 20vh; }
        .yin-yang {
            width: 60px; height: 60px; margin: 0 auto 20px auto; border-radius: 50%;
            background: linear-gradient(to right, var(--ink-black) 50%, transparent 50%);
            border: 2px solid var(--ink-black); animation: spin 1.5s linear infinite;
        }
        .yin-yang::before, .yin-yang::after { content: ""; display: block; width: 30px; height: 30px; border-radius: 50%; margin-left: 15px; }
        .yin-yang::before { background: var(--ink-black); border: 8px solid var(--paper-bg); box-sizing: border-box; }
        .yin-yang::after { background: var(--paper-bg); border: 8px solid var(--ink-black); box-sizing: border-box; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; margin-top: 30px; }
        .card-btn {
            background: transparent; border: 1px solid var(--ink-gray); padding: 20px 10px;
            text-align: center; cursor: pointer; position: relative; transition: all 0.3s;
        }
        .card-btn::before {
            content: ""; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px dashed var(--ink-gray); opacity: 0.5; transition: 0.3s;
        }
        .card-btn:hover { background: var(--ink-black); color: var(--paper-bg); border-color: var(--ink-black); transform: translateY(-3px); }
        .card-btn:hover::before { border-color: var(--paper-bg); opacity: 0.8; }
        .card-btn h3 { margin: 0 0 8px 0; font-size: 1.5em; letter-spacing: 2px; }
        .card-btn p { margin: 0; font-size: 0.9em; opacity: 0.8; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        .icon-btn {
            background: transparent; color: var(--ink-black); border: 1px solid var(--ink-black);
            padding: 8px 14px; cursor: pointer; border-radius: 4px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: 0.3s; gap: 6px; font-family: inherit; font-size: 1.05em; letter-spacing: 1px;
        }
        .icon-btn:hover { background: var(--ink-black); color: var(--paper-bg); }
        .icon-btn svg { width: 20px; height: 20px; }
        .icon-btn.btn-danger { border-color: var(--cinnabar-red); color: var(--cinnabar-red); }
        .icon-btn.btn-danger:hover { background: var(--cinnabar-red); color: var(--paper-bg); }

        /* 作者與難度篩選列 */
        .filter-row { 
            display: flex; overflow-x: auto; gap: 12px; padding-bottom: 12px; margin-bottom: 15px; 
            border-bottom: 1px dashed var(--ink-gray); 
        }
        .filter-row::-webkit-scrollbar { height: 6px; }
        .filter-row::-webkit-scrollbar-thumb { background: var(--ink-gray); border-radius: 4px; }
        
        .author-tag {
            white-space: nowrap; padding: 4px 12px; color: var(--ink-black);
            border-bottom: 2px solid transparent; cursor: pointer; font-size: 1.1em; transition: 0.2s;
        }
        .author-tag.active { border-bottom-color: var(--cinnabar-red); color: var(--cinnabar-red); font-weight: bold; }

        /* 難度標籤專屬樣式 (莫蘭迪色系) */
        .diff-tag {
            white-space: nowrap; padding: 6px 14px; color: var(--ink-black);
            cursor: pointer; font-size: 1.05em; font-weight: bold; transition: 0.2s;
            border-radius: 6px; opacity: 0.5; border: 1px solid transparent;
        }
        .diff-tag.active { opacity: 1; border-color: currentColor; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .diff-0 { background-color: #f0f0f0; color: #4a4a4a; }
        .diff-0.active { background-color: #dcdcdc; border-color: #8c8c8c; }
        .diff-1 { background-color: #e2e8df; color: #5c7054; }
        .diff-1.active { background-color: #c5d1c0; border-color: #5c7054; }
        .diff-2 { background-color: #e3e8eb; color: #586c7d; }
        .diff-2.active { background-color: #c9d2d9; border-color: #586c7d; }
        .diff-3 { background-color: #f1ede3; color: #8c7b56; }
        .diff-3.active { background-color: #e2d9c4; border-color: #8c7b56; }
        .diff-4 { background-color: #eee3e2; color: #8f5c57; }
        .diff-4.active { background-color: #dec2bf; border-color: #8f5c57; }
        .diff-5 { background-color: #e9e5e9; color: #726270; }
        .diff-5.active { background-color: #d1cbd1; border-color: #726270; }

        .search-bar { position: relative; margin-bottom: 15px; }
        .search-bar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-gray); }
        .search-bar input {
            width: 100%; padding: 12px 12px 12px 42px; border: 1px solid var(--border-line); background: transparent;
            font-size: 1.2em; font-family: var(--font-book); color: var(--ink-black); box-sizing: border-box;
        }
        .search-bar input:focus { outline: none; border-color: var(--cinnabar-red); background: rgba(255,255,255,0.3); }

        .poem-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; 
            padding: 10px 5px; 
            margin-top: 15px;
        }
        .poem-card {
            background: #faf7ee;
            border: 1px solid var(--border-line);
            padding: 22px;
            position: relative;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .poem-card.diff-border-1 { border-left: 5px solid #8a9a83; }
        .poem-card.diff-border-2 { border-left: 5px solid #6b7e8c; }
        .poem-card.diff-border-3 { border-left: 5px solid #bda87b; }
        .poem-card.diff-border-4 { border-left: 5px solid #a87873; }
        .poem-card.diff-border-5 { border-left: 5px solid #806f7e; }

        .poem-card:hover { transform: translateY(-4px); box-shadow: 4px 10px 18px rgba(0,0,0,0.08); }
        
        .pc-title { font-size: 1.45em; font-weight: bold; margin-bottom: 8px; color: var(--ink-black); letter-spacing: 1px; }
        .pc-snippet {
            font-size: 1.05em; color: var(--ink-gray); margin-bottom: 20px; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .pc-meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.05em; color: var(--ink-gray); border-top: 1px dashed rgba(92,92,92,0.3); padding-top: 12px;
        }
        .diff-badge { font-size: 0.85em; padding: 2px 8px; border-radius: 12px; font-weight: bold; }

  /* =========================================
           ✨ 終極折衷方案：純 CSS 渲染信箋質感 (極致流暢且美觀)
           ========================================= */
    .article-wrap {
    /* 主容器只保留純色底、邊框與排版屬性 */
    background-color: #fcf9f2; 
    border: 2px solid var(--border-line); 
    outline: 1px solid var(--border-line);
    outline-offset: -6px; 
    padding: 50px 40px; 
    margin: 20px auto 80px auto;
    box-shadow: inset 0 0 30px rgba(167, 51, 34, 0.03), 0 8px 20px rgba(0,0,0,0.06);
    border-radius: 2px;
    position: relative; /* 必須加上 */
    z-index: 1;         /* 必須加上 */
    /* 🛑 絕對不要加 transition: padding */
}

/* ✨ 獨立效能層：將複雜濾鏡放在這裡，就不會干擾文字動畫 */
.article-wrap::before {
    content: ""; position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: -1; pointer-events: none;
    
    background-image: 
        repeating-linear-gradient(to bottom, transparent, transparent 5px, rgba(120, 90, 50, 0.025) 5px, rgba(120, 90, 50, 0.025) 6px),
        url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(%23paper)" opacity="0.08"/></svg>'),
        linear-gradient(145deg, rgba(255, 255, 255, 0.5) 0%, rgba(180, 140, 90, 0.08) 100%);
    background-blend-mode: normal, multiply, normal;
}

        

        /* 針對手機版微調邊距，保持版面精緻 */
        @media (max-width: 849px) {
            .article-wrap { 
                padding: 30px 20px; 
                outline-offset: -4px; 
            }
        }
        .p-title { text-align: center; font-size: 2.4em; margin-bottom: 5px; font-weight: bold; letter-spacing: 3px; }
        .p-author { text-align: center; color: var(--ink-gray); margin-bottom: 20px; font-size: 1.2em; letter-spacing: 2px; }
        
        .progress-wrapper { max-width: 300px; margin: 15px auto 0 auto; display: none; }
        .progress-bar-bg { background: rgba(0,0,0,0.1); border-radius: 10px; height: 6px; overflow: hidden; position: relative; }
        .progress-bar-fill { background: var(--cinnabar-red); height: 100%; width: 0%; transition: width 0.2s ease; }

        .content-area { font-size: 1.45em; line-height: 1.8; margin-bottom: 30px; }
        
        /* 統一文字縮排與莫蘭迪段落顏色循環 */
        .morandi-text p {
            text-indent: 2em;
            margin: 0 0 0.8em 0;
            text-align: justify;
            text-justify: inter-ideograph;
            transition: color 0.3s ease;
        }
        
        /* 段落顏色循環 (明顯且淡雅的莫蘭迪色系) */
        .morandi-text p:nth-of-type(5n+1) { color: #2b2b2b; } /* 濃黑 */
        .morandi-text p:nth-of-type(5n+2) { color: #3d7a60; } /* 竹青 (加深綠) */
        .morandi-text p:nth-of-type(5n+3) { color: #3b6b96; } /* 藏青 (加深藍) */
        .morandi-text p:nth-of-type(5n+4) { color: #9e4a41; } /* 胭脂 (加深紅) */
        .morandi-text p:nth-of-type(5n+5) { color: #7a5885; } /* 檀灰 (加深紫) */

        .fab-bar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: var(--ink-black); padding: 10px 20px; border-radius: 40px;
            display: flex; gap: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); z-index: 1000;
            display: none;
        }
        .fab-bar .icon-btn {
            border: none; color: #fff; background: transparent; padding: 6px 12px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.85em;
        }
        .fab-bar .icon-btn:hover { background: rgba(255,255,255,0.1); }
        .fab-bar svg { width: 22px; height: 22px; }

    .overlay-panel {
            position: fixed; background: var(--panel-bg);
            box-shadow: 0 0 25px rgba(0,0,0,0.2); z-index: 1001;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; flex-direction: column; overflow: hidden;
            background-image: 
                linear-gradient(90deg, rgba(43,43,43,0.02) 1px, transparent 1px),
                linear-gradient(rgba(43,43,43,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            will-change: transform; /* ✨ 提示手機瀏覽器使用 GPU 專心處理滑動 */
        
        }
        
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; border-bottom: 2px solid var(--border-line); background: var(--panel-bg);
        }
        .panel-header h3 { margin: 0; font-size: 1.4em; letter-spacing: 2px; }
        .panel-close { background: transparent; border: none; font-size: 1.5em; cursor: pointer; color: var(--ink-black); }
        
        .panel-body { padding: 25px; overflow-y: auto; flex: 1; font-size: 1.25em; line-height: 1.7; }

        .remark-table { width: 100%; border-collapse: collapse; }
        .remark-table th, .remark-table td { border: 1px solid var(--border-line); padding: 12px; text-align: left; vertical-align: top; }
        .remark-table thead th { background: rgba(43,43,43,0.05); font-size: 1.1em; letter-spacing: 2px; }
        .r-idx { width: 40px; text-align: center !important; font-weight: bold; color: var(--ink-black); font-size: 1.1em; }
        .vocab-badge {
            background-color: var(--morandi-green); color: #ffffff;
            padding: 4px 10px; border-radius: 4px; font-weight: bold;
            display: inline-block; letter-spacing: 1px;
        }
        .btn-vocab-save { background: none; border: none; cursor: pointer; transition: 0.2s; padding: 5px; border-radius: 50%; }
        .btn-vocab-save:hover { background: rgba(0,0,0,0.05); transform: scale(1.1); }

        .empty { color: var(--ink-gray); font-style: italic; text-align: center; padding: 20px; letter-spacing: 2px; }

        /* 字詞庫 (Vocab Book) 卡片設計 */
        .vocab-grid { display: grid; gap: 20px; grid-template-columns: 1fr; margin-top: 20px; }
        .vocab-card {
            background: #faf7ee; border: 1px solid var(--border-line);
            border-left: 6px solid var(--morandi-green); padding: 20px;
            border-radius: 4px; position: relative; box-shadow: 2px 4px 10px rgba(0,0,0,0.03);
            transition: all 0.3s;
        }
        .vocab-card:hover { transform: translateY(-3px); box-shadow: 4px 8px 15px rgba(0,0,0,0.06); border-left-color: var(--cinnabar-red); }
        .vocab-card .v-word { font-size: 1.4em; font-weight: bold; color: var(--cinnabar-red); margin-bottom: 10px; letter-spacing: 1px; }
        .vocab-card .v-exp { font-size: 1.2em; color: var(--ink-black); margin-bottom: 15px; line-height: 1.6; text-align: justify; }
        .vocab-card .v-source { font-size: 1em; color: var(--ink-gray); text-align: right; border-top: 1px dashed rgba(92,92,92,0.3); padding-top: 10px; font-style: italic; }
        .vocab-card .v-del {
            position: absolute; top: 15px; right: 15px; background: none; border: none; cursor: pointer; color: var(--ink-gray); transition: 0.2s; padding: 5px;
        }
        .vocab-card .v-del:hover { color: var(--cinnabar-red); transform: scale(1.1); }

        /* 出題面板 Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 3000;
            display: none; justify-content: center; align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--panel-bg); border: 2px solid var(--border-line);
            border-radius: 6px; width: 90%; max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); overflow: hidden;
            background-image: 
                linear-gradient(90deg, rgba(43,43,43,0.02) 1px, transparent 1px),
                linear-gradient(rgba(43,43,43,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; border-bottom: 1px dashed var(--border-line);
        }
        .modal-header h3 { margin: 0; font-size: 1.4em; letter-spacing: 2px; color: var(--ink-black); }
        .modal-body { padding: 25px 20px; }
        .quiz-option {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 18px; font-size: 1.25em; color: var(--ink-black);
        }
        .quiz-option input[type="number"] {
            width: 55px; padding: 5px; text-align: center; border: 1px solid var(--border-line); 
            border-radius: 4px; font-family: inherit; font-size: 1em; background: transparent;
        }

        /* =========================================

    const dynastyOrder = ["古文觀止","先秦","秦代","漢代","兩漢","魏晉","南北朝","隋代","唐代","五代","宋代","金朝","遼代","元代","明代","清代","近代","現代","未知"];
    const fileUrls = [
        "guwenguanzhi_converted.json", 
        "guwen0-1000.json", "guwen1001-2000.json", "guwen2001-3000.json",
        "guwen3001-4000.json", "guwen4001-5000.json", "guwen5001-6000.json",
        "guwen6001-7000.json", "guwen7001-8000.json", "guwen8001-9000.json",
        "guwen9001-10000.json"
    ].map(name => `https://raw.githubusercontent.com/kenchan20141/chinese-gushiwen/master/guwen/${name}`);

    const poetryTags = ["詩", "詞", "曲", "五言", "七言", "絕句", "律詩", "樂府", "古詩", "楚辭", "唐詩", "宋詞", "元曲", "辭賦", "詩經"];

    let db = {}; 
    let currentDynastyPoems = []; 
    let currentActiveAuthor = "全部";
    let currentActiveDifficulty = 0;
    let currentPoem = null;
    let converter = (text) => text;
    
    let favorites = JSON.parse(localStorage.getItem('guwen_favorites') || '[]');
    let savedVocabs = JSON.parse(localStorage.getItem('guwen_vocabs') || '[]');

    let cacheRemark = '';
    let cacheTranslation = '';
    let cacheShangxi = '';
    let lastSelectedText = "";

    let savedWidth = localStorage.getItem('panel-width') || '450px';
    let savedHeight = localStorage.getItem('panel-height') || '40vh';
    document.documentElement.style.setProperty('--panel-width', savedWidth);
    document.documentElement.style.setProperty('--panel-height', savedHeight);

    document.addEventListener("DOMContentLoaded", initApp);

    async function initApp() {
        initPanelResize();
        try {
            if (typeof OpenCC !== 'undefined') converter = OpenCC.Converter({ from: 'cn', to: 't' });
            const responses = await Promise.all(fileUrls.map(url => fetch(url).catch(() => null)));
            let allLines = [];
            for (let res of responses) {
                if (res && res.ok) allLines.push(...(await res.text()).split('\n'));
            }

            for (let line of allLines) {
                line = line.trim();
                if (!line) continue;
                if (line.endsWith(',')) line = line.slice(0, -1);
                line = line.replace(/\]",/g, '],');

                try {
                    const p = JSON.parse(line);
                    
                    if (!p.remark || typeof p.remark !== 'string' || p.remark.trim() === '') continue;
                    
                    let isPoem = false;
                    if (p.type && Array.isArray(p.type)) {
                        isPoem = p.type.some(tag => poetryTags.some(pt => tag.includes(pt)));
                    }
                    const titleCheck = safeConvert(p.title || "");
                    if (titleCheck.endsWith("詩") || titleCheck.endsWith("詞") || titleCheck.endsWith("曲") || titleCheck.endsWith("歌") || titleCheck.endsWith("絕句")) {
                        isPoem = true;
                    }
                    if (isPoem) continue; 

                    let rawContent = cleanClassicalContent(safeConvert(p.content || "")).replace(/[\s\r\n]/g, '');
                    if (rawContent.length <= 100) continue;

                    let dyn = safeConvert(p.dynasty || "未知");
                    if (!db[dyn]) db[dyn] = [];

                    let currentTitle = safeConvert(p.title || "");
                    let currentWriter = safeConvert(p.writer || "");
                    let isDuplicate = db[dyn].some(existing => {
                        return safeConvert(existing.title || "") === currentTitle && 
                               safeConvert(existing.writer || "") === currentWriter;
                    });

                    if (!isDuplicate) {
                        db[dyn].push(p);
                    }
                } catch(e) {}
            }
            renderCategories();
            showView('view-categories');
        } catch (err) {
            document.getElementById('view-loading').innerHTML = "<h2>載入失敗：" + err.message + "</h2>";
        }
    }

    function removeBrackets(text) {
        if (!text) return "";
        let prev = "";
        while (text !== prev) {
            prev = text;
            text = text.replace(/[（\(【\[][^）\)】\]]*[）\)】\]]/g, '');
        }
        return text.trim();
    }

    function initPanelResize() {
        let isResizing = false;
        let startY, startX, startHeight, startWidth;
        const resizer = document.getElementById('panel-resizer');

        resizer.addEventListener('mousedown', initDrag);
        resizer.addEventListener('touchstart', initDrag, {passive: false});

        function initDrag(e) {
            e.preventDefault();
            isResizing = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
            
            const panel = document.getElementById('overlay-panel');
            startWidth = panel.offsetWidth;
            startHeight = panel.offsetHeight;

            document.addEventListener('mousemove', doDrag);
            document.addEventListener('touchmove', doDrag, {passive: false});
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function doDrag(e) {
            if (!isResizing) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            if (window.innerWidth >= 850) {
                let newWidth = startWidth - (clientX - startX);
                if(newWidth < 250) newWidth = 250; 
                if(newWidth > window.innerWidth * 0.8) newWidth = window.innerWidth * 0.8; 
                document.documentElement.style.setProperty('--panel-width', newWidth + 'px');
            } else {
                let newHeight = startHeight - (clientY - startY);
                if(newHeight < window.innerHeight * 0.15) newHeight = window.innerHeight * 0.15;
                if(newHeight > window.innerHeight * 0.9) newHeight = window.innerHeight * 0.9;
                document.documentElement.style.setProperty('--panel-height', newHeight + 'px');
            }
        }

        function stopDrag() {
            isResizing = false;
            document.removeEventListener('mousemove', doDrag);
            document.removeEventListener('touchmove', doDrag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchend', stopDrag);
            
            localStorage.setItem('panel-width', document.documentElement.style.getPropertyValue('--panel-width'));
            localStorage.setItem('panel-height', document.documentElement.style.getPropertyValue('--panel-height'));
        }
    }

    function safeConvert(val) {
        if (!val) return "";
        if (Array.isArray(val)) val = val.join("\n");
        if (typeof val === 'object') val = JSON.stringify(val);
        let twText = converter(String(val));
        twText = twText.replace(/“/g, '「').replace(/”/g, '」').replace(/‘/g, '『').replace(/’/g, '』');
        twText = correctClassicalChinese(twText);
        return twText;
    }

    function cleanClassicalContent(text) {
        return removeBrackets(text);
    }

    function wrapParagraphs(text) {
        if (!text) return '';
        text = text.replace(/&nbsp;/g, '').replace(/　/g, ''); 
        let lines = text.split(/\r?\n/).map(x => x.trim()).filter(x => x !== '');
        return lines.map(line => `<p>${line}</p>`).join('');
    }

    function generateDifficultyAndSort(poemsArray) {
        poemsArray.forEach(p => {
            p._rawLength = cleanClassicalContent(safeConvert(p.content || "")).length;
        });
        
        let temp = [...poemsArray].sort((a, b) => a._rawLength - b._rawLength);
        let total = temp.length;
        if (total === 0) return;
        
        temp.forEach((p, idx) => {
            if (idx < total * 0.2) p._diff = 1;
            else if (idx < total * 0.4) p._diff = 2;
            else if (idx < total * 0.6) p._diff = 3;
            else if (idx < total * 0.8) p._diff = 4;
            else p._diff = 5;
        });

        poemsArray.sort((a, b) => {
            if (a._diff !== b._diff) return a._diff - b._diff;
            let writerA = safeConvert(a.writer || '佚名');
            let writerB = safeConvert(b.writer || '佚名');
            if (writerA !== writerB) return writerA.localeCompare(writerB, 'zh-TW');
            return a._rawLength - b._rawLength;
        });
    }

    // 1. 從原字串提取所有 {vocab, exp} 物件
    function extractVocabs(text) {
        let lines = text.split(/\r?\n/);
        let vocabs = [];
        lines.forEach(line => {
            if (!line.trim()) return;
            
            let pureLine = line.trim().replace(/^([\[\(【（]?\d+[\]\)】）]?|[①-⑳])\s*[.:：]?\s*/, '');
            if (!pureLine) return;

            let vocab = '-';
            let exp = pureLine;

            let bracketMatch = pureLine.match(/^[【\[]([^】\]]+)[】\]]\s*(.*)$/);
            if (bracketMatch) {
                vocab = bracketMatch[1].trim();
                exp = bracketMatch[2].trim();
            } else {
                let splitMatch = pureLine.match(/^([^：:——]{1,15})[：:——]\s*(.*)$/);
                if (splitMatch) {
                    vocab = splitMatch[1].trim();
                    exp = splitMatch[2].trim();
                }
            }
            
            vocab = removeBrackets(vocab);
            exp = removeBrackets(exp);

            if(vocab && vocab !== '-') {
                vocabs.push({vocab, exp});
            }
        });
        return vocabs;
    }

    // 2. 在正文中搜尋字詞，並標記為高亮。使用 PUA 防替換衝突
 // 2. 在正文中搜尋字詞，並標記為高亮。使用 PUA 防替換衝突 (舊版高效寫法)
    function highlightVocabsInContent(contentStr, vocabs) {
        // 以字詞長度降序排列，避免「短詞」干擾「長詞」的高亮
        let sorted = [...vocabs].sort((a, b) => b.vocab.length - a.vocab.length);
        
        let placeholders = [];
        let processedText = contentStr;
        
        sorted.forEach((item, index) => {
            if (item.vocab.length < 1) return;
            
            // 使用 Private Use Area 字符作為佔位符，保證絕不會與古文或英文字母衝突
            let pKey = String.fromCharCode(0xE000 + index);
            let safeVocab = item.vocab.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            let regex = new RegExp(safeVocab, 'g');
            
            if (regex.test(processedText)) {
                processedText = processedText.replace(regex, pKey);
                placeholders.push({
                    key: pKey,
                    vocab: item.vocab,
                    exp: item.exp
                });
            }
        });
        
        // 將佔位符轉為帶有 onclick 事件的 HTML 元素
        placeholders.forEach((p) => {
            let encVocab = encodeURIComponent(p.vocab);
            let encExp = encodeURIComponent(p.exp);
            let span = `<span class="inline-vocab" onclick="showVocabTooltip(event, '${encVocab}', '${encExp}')">${p.vocab}</span>`;
            processedText = processedText.replace(new RegExp(p.key, 'g'), span);
        });
        
        return processedText;
    }
    
    // 3. 生成側邊面板用的注釋表格 (改為吃 List)
    function parseRemarksToTableFromList(vocabs) {
        let safeTitle = currentPoem ? safeConvert(currentPoem.title) : '未知';
        let tableHtml = `<table class="remark-table">
            <thead>
                <tr>
                    <th width="10%">序號</th>
                    <th width="20%" style="text-align:center;">字/詞/句</th>
                    <th>解析</th>
                    <th width="15%" style="text-align:center;">收藏</th>
                </tr>
            </thead>
            <tbody>`;
        
        if (vocabs.length === 0) {
             return tableHtml + `<tr><td colspan="4" class="empty">卷宗殘缺，暫無注釋</td></tr></tbody></table>`;
        }

        vocabs.forEach((v, idx) => {
            let vocabHtml = `<span class="vocab-badge">${v.vocab}</span>`;
            let isSaved = savedVocabs.some(sv => sv.vocab === v.vocab && sv.title === safeTitle);
            let heartSvg = isSaved 
                ? `<svg viewBox="0 0 24 24" width="20" height="20" stroke="var(--cinnabar-red)" stroke-width="2" fill="var(--cinnabar-red)"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>`
                : `<svg viewBox="0 0 24 24" width="20" height="20" stroke="var(--ink-gray)" stroke-width="2" fill="none"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>`;

            let safeVocabStr = encodeURIComponent(v.vocab);
            let safeExpStr = encodeURIComponent(v.exp);

            tableHtml += `<tr>
                <td class="r-idx">${idx + 1}.</td>
                <td style="text-align:center;">${vocabHtml}</td>
                <td>${v.exp}</td>
                <td style="text-align:center; vertical-align:middle;">
                    <button class="btn-vocab-save" onclick="toggleVocab('${safeVocabStr}', '${safeExpStr}', this)" title="收藏此詞解">
                        ${heartSvg}
                    </button>
                </td>
            </tr>`;
        });
        tableHtml += '</tbody></table>';
        return tableHtml;
    }

    // ✨ 彈出 Tooltip 的主程式
    function showVocabTooltip(e, encVocab, encExp) {
        e.stopPropagation(); 
        hideVocabTooltip(); // 先隱藏其他的

        let vocab = decodeURIComponent(encVocab);
        let exp = decodeURIComponent(encExp);
        let safeTitle = currentPoem ? safeConvert(currentPoem.title) : '未知';
        
        let isSaved = savedVocabs.some(v => v.vocab === vocab && v.title === safeTitle);
        let heartSvg = isSaved 
            ? `<svg viewBox="0 0 24 24" width="22" height="22" stroke="var(--cinnabar-red)" stroke-width="2" fill="var(--cinnabar-red)"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>`
            : `<svg viewBox="0 0 24 24" width="22" height="22" stroke="var(--ink-gray)" stroke-width="2" fill="none"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>`;

        const tooltip = document.getElementById('vocab-tooltip');
        
        tooltip.innerHTML = `
            <div class="tooltip-header">
                <span class="tooltip-vocab">${vocab}</span>
                <button class="btn-vocab-save" onclick="toggleVocab('${encVocab}', '${encExp}', this); event.stopPropagation();" title="收藏此詞解">
                    ${heartSvg}
                </button>
            </div>
            <div class="tooltip-exp">${exp}</div>
        `;
        
        tooltip.style.display = 'block';
        
        const rect = e.target.getBoundingClientRect();
        let top = window.scrollY + rect.bottom + 10;
        let left = window.scrollX + rect.left + (rect.width / 2) - (tooltip.offsetWidth / 2);
        
        if (left < 10) left = 10;
        if (left + tooltip.offsetWidth > document.documentElement.clientWidth - 10) {
            left = document.documentElement.clientWidth - tooltip.offsetWidth - 10;
        }
        
        tooltip.style.top = top + 'px';
        tooltip.style.left = left + 'px';
    }

    function hideVocabTooltip() {
        const tooltip = document.getElementById('vocab-tooltip');
        if (tooltip) tooltip.style.display = 'none';
    }

    // 點擊空白處隱藏 Tooltip
    document.addEventListener('click', (e) => {
        const tooltip = document.getElementById('vocab-tooltip');
        if (tooltip && tooltip.style.display === 'block') {
            if (!tooltip.contains(e.target) && !e.target.classList.contains('inline-vocab')) {
                hideVocabTooltip();
            }
        }
    });

    window.addEventListener('scroll', () => { hideVocabTooltip(); }, {passive: true});

    // 改寫：更新本機資料庫並同步所有快取 UI (Tooltip / 側邊面板)
    function toggleVocab(encVocab, encExp, btn) {
        let vocab = decodeURIComponent(encVocab);
        let exp = decodeURIComponent(encExp);
        
        let title = currentPoem ? safeConvert(currentPoem.title) : '未知';
        let author = currentPoem ? safeConvert(currentPoem.writer) : '佚名';

        let idx = savedVocabs.findIndex(v => v.vocab === vocab && v.title === title);
        if (idx >= 0) {
            savedVocabs.splice(idx, 1);
            btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" stroke="var(--ink-gray)" stroke-width="2" fill="none"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>`;
        } else {
            savedVocabs.push({ vocab, exp, title, author });
            btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" stroke="var(--cinnabar-red)" stroke-width="2" fill="var(--cinnabar-red)"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>`;
        }
        localStorage.setItem('guwen_vocabs', JSON.stringify(savedVocabs));

        // ✨ 即時同步側邊欄快取：如果在打開狀態，直接重新渲染表格
        if (currentPoem) {
            let extractedVocabs = extractVocabs(safeConvert(currentPoem.remark));
            cacheRemark = parseRemarksToTableFromList(extractedVocabs);
            
            const panelTitle = document.getElementById('panel-title').innerText;
            const panel = document.getElementById('overlay-panel');
            if (panel.classList.contains('open') && panelTitle === '注釋解析') {
                document.getElementById('panel-body').innerHTML = cacheRemark;
            }
        }
    }

2. 多論點絕對分離與因題制宜：任何總分達 4 分或以上的題目，必須最少拆解為兩個或以上的獨立論點。必須「因題制宜」決定結構（並列型、定義與應用型、跨篇章比較型等）。絕對不可將多個論點的主題句或文本依據塞在同一個段落或表格內。
3. 毋須直引原文原則：不需要直引原文，只需準確「概括」或「引述」文本內容與情節即可。
4. 【一文一格】絕對防重複原則（極度重要）：任何一段答案文字，只能歸入「主題句」、「文本依據/概括」、「闡釋」其中一個最準確的層次。絕對不可重複。主題句必須經過高度的「提煉」與「歸納」。
5. 強制文本依據原則（極度重要）：即使是寫作手法好處題，也必須從文本中找出具體的相關情節或句意作為佐證例子。絕對禁止「無特定文本依據」、「泛指全文運用」或空泛論述。
6. 精簡點評與深度闡釋（拒絕後設說明）：闡釋部分必須直接給出詳細、具體、豐富的完美示範內容，深入解剖文本深層邏輯。絕對不可出現「必須緊扣XX的影響力」這類指導語或後設說明。闡釋內容必須 100% 緊扣並證明該主題句。
7. 表格化排版：長問答的標準答案請強制使用「表格」形式呈現，每一獨立論點生成一個獨立表格。表格欄位強制為：【主題句】、【文本依據/概括】、【闡釋】，以最嚴謹的方式展示滿分答案的結構。`;
        }

        navigator.clipboard.writeText(prompt).then(() => {
            alert('已成功編寫指令！\n\n即將為您開啟 Gemini，請直接貼上指令並送出。');
            window.open('https://gemini.google.com/app', '_blank');
            closeQuizModal();
        }).catch(err => {
            alert('系統複製失敗，請手動複製以下指令：\n\n' + prompt);
        });
    }

   let synth = window.speechSynthesis;
    let currentUtterance = null;
    
    // ======== 新增：手機端音訊解鎖機制 ========
    let ttsUnlocked = false;
    function unlockTTS() {
        if (!ttsUnlocked) {
            let silentUtterance = new SpeechSynthesisUtterance('');
            silentUtterance.volume = 0; // 靜音
            synth.speak(silentUtterance);
            ttsUnlocked = true;
            window.removeEventListener('touchstart', unlockTTS);
            window.removeEventListener('click', unlockTTS);
        }
    }
    // 監聽用戶的第一次點擊或觸摸來解鎖
    window.addEventListener('touchstart', unlockTTS, { once: true });
    window.addEventListener('click', unlockTTS, { once: true });
    // =========================================

    const playSvg = `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> 吟誦`;
    const stopSvg = `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="6" y="6" width="12" height="12"></rect></svg> 停止`;

   function toggleTTS() {
        const btn = document.getElementById('btn-tts');
        const pWrapper = document.getElementById('progress-wrapper');
        const pBar = document.getElementById('progress-bar-fill');

        if (synth.speaking || synth.paused) {
            stopTTS();
        } else {
            if (!currentPoem) return;
            
            // 立即變更 UI，讓用戶知道有反應（不要等 onstart，手機上 onstart 常常會遲到）
            btn.style.backgroundColor = 'var(--cinnabar-red)';
            btn.style.color = 'var(--paper-bg)';
            btn.innerHTML = stopSvg;
            pWrapper.style.display = 'block';
            pBar.style.width = '0%';

            let rawContent = removeBrackets(cleanClassicalContent(safeConvert(currentPoem.content)));
            let textToRead = safeConvert(currentPoem.title) + "。" + 
                             safeConvert(currentPoem.writer) + "。" + 
                             rawContent.replace(/<[^>]+>/g, '').replace(/\n/g, '。');
            
            // 確保之前沒有卡住的語音
            synth.cancel(); 

            // 設定延遲，給手機瀏覽器緩衝時間
            setTimeout(() => {
                currentUtterance = new SpeechSynthesisUtterance(textToRead);
                currentUtterance.lang = 'zh-TW';
                currentUtterance.rate = 0.8; 
                
                // 強制尋找手機內建的中文語音 (解決 iOS 找不到預設聲音的問題)
                let voices = synth.getVoices();
                let zhVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-HK') || v.lang.includes('zh-CN'));
                if (zhVoice) {
                    currentUtterance.voice = zhVoice;
                }
                
                currentUtterance.onboundary = (event) => {
                    if (event.name === 'word' || event.name === 'sentence') {
                        let percent = Math.floor((event.charIndex / textToRead.length) * 100);
                        if (percent > 100) percent = 100;
                        pBar.style.width = percent + '%';
                    }
                };

                currentUtterance.onend = () => stopTTS();
                currentUtterance.onerror = (e) => {
                    console.error("TTS Error:", e);
                    stopTTS();
                };
                
                synth.speak(currentUtterance);
            }, 100);
        }
    }

    function stopTTS() {
        if (synth) synth.cancel();
        const btn = document.getElementById('btn-tts');
        const pWrapper = document.getElementById('progress-wrapper');
        if (btn) {
            btn.style.backgroundColor = 'transparent';
            btn.style.color = 'var(--cinnabar-red)';
            btn.innerHTML = playSvg;
        }
        if (pWrapper) pWrapper.style.display = 'none';
    }
</script>
